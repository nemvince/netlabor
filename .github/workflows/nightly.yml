name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # oven-sh/setup-bun v2.2.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        working-directory: apps/web
        run: bunx vite build

      - name: Compile controller and agent
        run: |
          set -euo pipefail
          version=$(git rev-parse --short=7 HEAD)
          mkdir -p dist
          for target in x64 arm64; do
            bun build apps/controller/src/index.ts --compile --target="bun-linux-$target" --asset apps/web/dist --define "NB_BUILD_VERSION=\"$version\"" --define 'NB_WEB_EMBED_DIR="apps/web/dist"' --outfile "dist/netlabor-controller-linux-$target"
            bun build apps/agent/src/index.ts --compile --target="bun-linux-$target" --outfile "dist/netlabor-agent-linux-$target"
          done

      - name: Write checksums
        working-directory: dist
        run: sha256sum netlabor-controller-linux-x64 netlabor-controller-linux-arm64 netlabor-agent-linux-x64 netlabor-agent-linux-arm64 > SHA256SUMS

      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release create nightly \
            --title "Nightly ${sha:0:7}" \
            --notes "Nightly build of ${sha}." \
            --prerelease \
            --target "$sha" \
            dist/netlabor-controller-linux-x64 \
            dist/netlabor-controller-linux-arm64 \
            dist/netlabor-agent-linux-x64 \
            dist/netlabor-agent-linux-arm64 \
            dist/SHA256SUMS
