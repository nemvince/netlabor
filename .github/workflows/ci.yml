name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netlabor
          POSTGRES_PASSWORD: netlabor
          POSTGRES_DB: netlabor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netlabor -d netlabor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun fmt --check

      - name: Unit tests
        run: bun test

      - name: Migrations
        env:
          NB_DATABASE_URL: postgres://netlabor:netlabor@127.0.0.1:5432/netlabor_test
        run: bun run db:migrate

      - name: Build binaries and web bundle
        run: bun run build

      - name: Build docs site
        run: bun run docs:build
